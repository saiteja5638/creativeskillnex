<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CreativeSkillNexus</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect trick.
      // Sends the real path to index.html via a query string so
      // react-router can pick it up and restore the route on load.
      // See: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // keeps "/CreativeSkillNexus"

      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
